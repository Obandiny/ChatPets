<div class="documento" *ngIf="diagnostico">


    <h1>Informe de Diagnóstico</h1>
    <span>{{ diagnostico.fecha | date:'fullDate' }}</span>


    <div class="mascota">
        <img [src]="diagnostico.imagen || 'assets/pet.png'">
        <h2>{{ diagnostico.nombre_mascota }}</h2>
    </div>

    <section class="diagnostico">
        <h3>Enfermedad Detectada</h3>
        <p>{{ diagnostico.enfermedad }}</p>

        <h3>Prioridad</h3>
        <span class="badge" [ngClass]="diagnostico.prioridad">
            {{ diagnostico.prioridad | uppercase }}
        </span>

        <h3>Recomendación</h3>
        <p class="recomendacion">{{ diagnostico.recomendacion }}</p>
    </section>
</div>
